<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Alpaca Scarlett';src:url('AlpacaScarlett.otf') format('opentype');font-weight:400;font-style:normal}
@import url('https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Mono&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#ffffff;--text:#000000;--text-dim:#666666;--border:#dddddd;--accent:#7c3aed;--daylight:#9333ea;--ciclorama:#2a6898}

body{
  width:1200px;height:630px;
  background:var(--bg);
  font-family:'PT Sans',-apple-system,sans-serif;
  color:var(--text);
  position:relative;
  overflow:hidden;
}

.border-line{position:absolute;left:0;right:0;height:1px;background:var(--border)}
.border-top{top:150px}
.border-bottom{top:478px}

.map-shot{
  position:absolute;top:0;right:0;width:700px;height:630px;
  background-image:url('map-crop.png');
  background-size:cover;
  background-position:center;
  -webkit-mask-image:linear-gradient(to left, rgba(0,0,0,1) 57%, rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(to left, rgba(0,0,0,1) 57%, rgba(0,0,0,0) 100%);
}
.map-shot::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top, rgba(255,255,255,0.55), rgba(255,255,255,0) 30%);
}

.content{position:absolute;top:150px;left:88px;right:88px;bottom:152px;display:flex;flex-direction:column;justify-content:center;gap:22px}

.wordmark{display:flex;align-items:baseline;gap:14px}
.wordmark .name{font-family:'Alpaca Scarlett',serif;font-size:78px;font-weight:400;letter-spacing:0.01em;line-height:1;text-transform:uppercase}
.wordmark .map{font-family:'PT Mono',monospace;font-size:26px;color:var(--accent);text-transform:uppercase;letter-spacing:0.1em}

.tagline{font-size:24px;color:var(--text-dim);line-height:1.5;max-width:640px}

.tags{position:absolute;left:88px;bottom:56px;display:flex;gap:16px;align-items:center}
.tag{font-family:'Alpaca Scarlett',serif;font-size:22px;letter-spacing:0.01em;text-transform:uppercase;color:var(--text-dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
</style>
</head>
<body>
  <div class="border-line border-top"></div>
  <div class="border-line border-bottom"></div>

  <div class="map-shot"></div>

  <div class="content">
    <div class="wordmark">
      <span class="name">Berlin Studio</span>
      <span class="map">map</span>
    </div>
    <p class="tagline">Every photography studio for hire in Berlin,<br>on one interactive map.</p>
  </div>

  <div class="tags">
    <span class="tag">Daylight</span>
    <span class="dot"></span>
    <span class="tag">Blackout</span>
    <span class="dot"></span>
    <span class="tag">Infinity Ciclorama</span>
    <span class="dot"></span>
    <span class="tag">Drive-in</span>
  </div>
</body>
</html>
